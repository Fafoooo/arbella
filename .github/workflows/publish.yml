name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-release-main
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout history and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use recent npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Install release dependencies
        run: npm ci --prefix .github/release

      - name: Version, publish to npm, and create GitHub release
        run: node .github/release/node_modules/semantic-release/bin/semantic-release.js --extends ./.github/release/release.config.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
